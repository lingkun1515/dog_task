# DogTask 实机配置 — Mower 底盘 + D1 机械臂
# 执行端 (real_task_server) 和调度端 (scheduler) 统一读取此文件

mode = "real"

# ============================================================
# 通信连接（底盘 TCP + 机械臂 HTTP + 感知 Orin）
# ============================================================
host = "10.10.170.239"         # 底盘 TCP 地址
port = 9002                    # 底盘 TCP 端口
orin = "10.10.170.191"         # Orin (抓取/视频流服务地址)
grasp_port = 5000              # 抓取服务端口
grasp_path = "/grasp"          # 抓取 API 路径

# ============================================================
# 机械臂
# ============================================================
arm_host = "192.168.123.100"   # D1 机械臂 HTTP 控制地址
arm_port = 8088                # D1 机械臂 HTTP 端口
calibration_path = "output/calibration_result.json"

# ============================================================
# 算法抓取配置（与 sim 统一结构）
# ============================================================
[algorithms]
arm_kinematics = "d1"
target_classes = ["bottle"]        # YOLO 检测目标类别
approach_height = 0.10
descend_step = 0.03
gripper_open = 65
gripper_close = 0
z_overshoot = 0.02
lift_height = 0.15
safe_park_angles = [0.0, 30.0, -10.0, 0.0, 0.0, 0.0]
