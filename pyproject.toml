[project]
name = "dogtask"
version = "0.1.0"
description = "机器人移动抓取任务调度与仿真系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
    "numpy>=2.2.6",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.0.0,<4.0.0",
    "pyyaml>=6.0",
]
realsense = [
    "opencv-python>=4.13.0.92",
    "pyrealsense2>=2.58.1.10581",
    "ultralytics>=8.4.58",
]

[project.scripts]
dogtask-server = "scheduler.server.app:run_server"
dogtask-sim = "execution.sim_mujoco.server:run_server"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scheduler"
module-root = ""
